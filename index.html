<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Four Cognitive Dynamics</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
  >

  <style>
    :root {
      --bg: #05070b;
      --panel: #0c1118;
      --panel-2: #0f151e;
      --border: #27313d;
      --border-light: #344150;
      --text: #e7ebf1;
      --muted: #8792a3;
      --dim: #4b5665;
      --bright: #f4f6f9;
      --accent: #cbd4df;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(105, 125, 150, 0.09),
          transparent 35%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .mono {
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;
    }

    .glass {
      background: rgba(8, 12, 18, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .simulation-tab {
      transition:
        background-color 0.18s ease,
        color 0.18s ease,
        border-color 0.18s ease;
    }

    .simulation-tab:hover {
      background: #151c25;
    }

    .simulation-tab.active {
      color: #070a0e;
      background: #e8edf3;
      border-color: #e8edf3;
    }

    .control-button {
      color: #dbe3ed;
      background: #0c1118;
      border: 1px solid #293441;
      transition:
        background-color 0.18s ease,
        border-color 0.18s ease,
        transform 0.12s ease;
    }

    .control-button:hover {
      background: #151d27;
      border-color: #455263;
    }

    .control-button:active {
      transform: translateY(1px);
    }

    .control-input {
      color: #dbe3ed;
      background: #0b1017;
      border: 1px solid #293441;
      outline: none;
    }

    .control-input:focus {
      border-color: #68788b;
      box-shadow: 0 0 0 2px rgba(130, 150, 175, 0.1);
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .metric-cell:last-child {
      border-right: none;
    }

    .scrollbar::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    .scrollbar::-webkit-scrollbar-track {
      background: #080c11;
    }

    .scrollbar::-webkit-scrollbar-thumb {
      background: #27313d;
      border-radius: 10px;
    }

    .scrollbar::-webkit-scrollbar-thumb:hover {
      background: #3b4857;
    }

    .fade-in {
      animation: fadeIn 0.3s ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(3px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 640px) {
      .simulation-tab {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       APPLICATION SHELL
       ========================================================= -->

  <div class="min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="glass sticky top-0 z-50 border-b border-slate-800/80">

      <div
        class="max-w-[1600px] mx-auto w-full px-4 sm:px-6 py-4"
      >

        <div
          class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4"
        >

          <div>
            <div
              class="mono text-[10px] sm:text-[11px] tracking-[0.28em] uppercase text-slate-500"
            >
              Interactive Cognition Laboratory
            </div>

            <h1
              class="mt-1 text-xl sm:text-2xl font-semibold tracking-tight text-slate-100"
            >
              Four Cognitive Dynamics
            </h1>
          </div>

          <!-- TABS -->
          <nav
            id="simulationTabs"
            class="
              flex
              gap-1
              p-1
              rounded-xl
              bg-slate-950/80
              border
              border-slate-800
              overflow-x-auto
              scrollbar
            "
            aria-label="Simulation navigation"
          >

            <button
              class="
                simulation-tab
                active
                whitespace-nowrap
                px-3
                py-2
                rounded-lg
                border
                border-transparent
                text-xs
                sm:text-sm
              "
              data-simulation="da"
            >
              Dialectical–Algorithmic
            </button>

            <button
              class="
                simulation-tab
                whitespace-nowrap
                px-3
                py-2
                rounded-lg
                border
                border-transparent
                text-xs
                sm:text-sm
                text-slate-400
              "
              data-simulation="cd"
            >
              Causal–Deterministic
            </button>

            <button
              class="
                simulation-tab
                whitespace-nowrap
                px-3
                py-2
                rounded-lg
                border
                border-transparent
                text-xs
                sm:text-sm
                text-slate-400
              "
              data-simulation="hp"
            >
              Holographical–Panoramic
            </button>

            <button
              class="
                simulation-tab
                whitespace-nowrap
                px-3
                py-2
                rounded-lg
                border
                border-transparent
                text-xs
                sm:text-sm
                text-slate-400
              "
              data-simulation="vs"
            >
              Vortical–Synergetic
            </button>

          </nav>

        </div>

      </div>

    </header>


    <!-- MAIN -->
    <main
      class="
        flex-1
        w-full
        max-w-[1600px]
        mx-auto
        px-3
        sm:px-5
        py-3
        sm:py-5
      "
    >

      <section
        class="
          overflow-hidden
          rounded-2xl
          border
          border-slate-800
          bg-[#080c12]
          shadow-2xl
          shadow-black/30
        "
      >

        <!-- SIMULATION HEADER -->
        <div
          class="
            px-4
            sm:px-6
            py-4
            border-b
            border-slate-800
            flex
            flex-col
            xl:flex-row
            xl:items-center
            xl:justify-between
            gap-4
          "
        >

          <div class="min-w-0">

            <div
              id="simulationKicker"
              class="mono text-[9px] tracking-[0.25em] uppercase text-slate-600"
            >
              CONCEPTUAL VISUALIZATION
            </div>

            <h2
              id="simulationTitle"
              class="mt-1 text-base sm:text-lg font-semibold text-slate-100"
            >
              Dialectical–Algorithmic Cognition
            </h2>

            <p
              id="simulationDescription"
              class="mt-1 text-xs leading-5 text-slate-500 max-w-4xl"
            >
              Ordered contradiction-driven process.
            </p>

          </div>

          <!-- CONTROLS -->
          <div
            id="simulationControls"
            class="flex flex-wrap items-center gap-2"
          ></div>

        </div>


        <!-- CANVAS -->
        <div
          id="canvasContainer"
          class="
            relative
            w-full
            h-[58vh]
            min-h-[520px]
            max-h-[820px]
            bg-[#05070b]
          "
        >

          <canvas
            id="canvas"
            aria-label="Interactive cognitive simulation"
          ></canvas>

        </div>


        <!-- METRICS -->
        <div
          id="metrics"
          class="
            grid
            grid-cols-2
            lg:grid-cols-4
            border-t
            border-slate-800
          "
        ></div>

      </section>


      <!-- FOOTER / HINT -->
      <div
        class="
          mt-3
          px-1
          mono
          text-[10px]
          leading-5
          text-slate-600
        "
        id="simulationHint"
      ></div>

    </main>

  </div>


  <!-- =========================================================
       APPLICATION JAVASCRIPT
       ========================================================= -->

  <script>

    "use strict";


    /* =========================================================
       DOM
       ========================================================= */

    const canvas =
      document.getElementById("canvas");

    const ctx =
      canvas.getContext("2d");

    const canvasContainer =
      document.getElementById("canvasContainer");

    const tabs =
      Array.from(
        document.querySelectorAll(".simulation-tab")
      );

    const titleElement =
      document.getElementById("simulationTitle");

    const descriptionElement =
      document.getElementById("simulationDescription");

    const kickerElement =
      document.getElementById("simulationKicker");

    const controlsElement =
      document.getElementById("simulationControls");

    const metricsElement =
      document.getElementById("metrics");

    const hintElement =
      document.getElementById("simulationHint");


    /* =========================================================
       GLOBAL CANVAS STATE
       ========================================================= */

    let canvasWidth = 1200;
    let canvasHeight = 700;
    let deviceScale = 1;

    let activeSimulation = "da";

    let previousTime =
      performance.now();

    let uiRefreshClock = 0;


    /* =========================================================
       UTILITY FUNCTIONS
       ========================================================= */

    function clamp(
      value,
      minimum = 0,
      maximum = 1
    ) {
      return Math.max(
        minimum,
        Math.min(maximum, value)
      );
    }


    function lerp(
      a,
      b,
      amount
    ) {
      return a + (b - a) * amount;
    }


    function randomBetween(
      minimum,
      maximum
    ) {
      return (
        minimum +
        Math.random() *
        (maximum - minimum)
      );
    }


    function distance(
      x1,
      y1,
      x2,
      y2
    ) {
      return Math.hypot(
        x2 - x1,
        y2 - y1
      );
    }


    function resizeCanvas() {

      const rect =
        canvas.getBoundingClientRect();

      canvasWidth =
        Math.max(1, rect.width);

      canvasHeight =
        Math.max(1, rect.height);

      deviceScale =
        Math.min(
          window.devicePixelRatio || 1,
          2
        );

      canvas.width =
        Math.round(
          canvasWidth * deviceScale
        );

      canvas.height =
        Math.round(
          canvasHeight * deviceScale
        );

      ctx.setTransform(
        deviceScale,
        0,
        0,
        deviceScale,
        0,
        0
      );
    }


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    resizeCanvas();


    /* =========================================================
       DRAWING PRIMITIVES
       ========================================================= */

    function clearScene() {

      ctx.fillStyle =
        "#05070b";

      ctx.fillRect(
        0,
        0,
        canvasWidth,
        canvasHeight
      );

      /*
       * Subtle technical grid.
       */
      ctx.lineWidth = 1;
      ctx.strokeStyle =
        "rgba(150,165,185,0.035)";

      const spacing = 40;

      for (
        let x = 0;
        x <= canvasWidth;
        x += spacing
      ) {

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvasHeight);
        ctx.stroke();
      }

      for (
        let y = 0;
        y <= canvasHeight;
        y += spacing
      ) {

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvasWidth, y);
        ctx.stroke();
      }
    }


    function drawLine(
      x1,
      y1,
      x2,
      y2,
      color = "rgba(180,195,215,0.2)",
      width = 1
    ) {

      ctx.beginPath();

      ctx.strokeStyle = color;
      ctx.lineWidth = width;

      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);

      ctx.stroke();
    }


    function drawArrow(
      x1,
      y1,
      x2,
      y2,
      color = "rgba(200,210,225,0.35)",
      width = 1
    ) {

      drawLine(
        x1,
        y1,
        x2,
        y2,
        color,
        width
      );

      const angle =
        Math.atan2(
          y2 - y1,
          x2 - x1
        );

      const size = 7;

      ctx.fillStyle = color;

      ctx.beginPath();

      ctx.moveTo(
        x2,
        y2
      );

      ctx.lineTo(
        x2 -
          size *
            Math.cos(angle - 0.45),
        y2 -
          size *
            Math.sin(angle - 0.45)
      );

      ctx.lineTo(
        x2 -
          size *
            Math.cos(angle + 0.45),
        y2 -
          size *
            Math.sin(angle + 0.45)
      );

      ctx.closePath();

      ctx.fill();
    }


    function drawCircle(
      x,
      y,
      radius,
      fill,
      stroke = null,
      strokeWidth = 1
    ) {

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = fill;
      ctx.fill();

      if (stroke) {

        ctx.strokeStyle = stroke;
        ctx.lineWidth = strokeWidth;

        ctx.stroke();
      }
    }


    function drawText(
      value,
      x,
      y,
      size = 11,
      color = "#aeb8c8",
      align = "center",
      weight = "400"
    ) {

      ctx.fillStyle = color;

      ctx.font =
        `${weight} ${size}px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace`;

      ctx.textAlign = align;
      ctx.textBaseline = "middle";

      ctx.fillText(
        value,
        x,
        y
      );
    }


    function drawPill(
      value,
      x,
      y,
      active = false
    ) {

      ctx.font =
        "600 10px ui-monospace, monospace";

      const width =
        ctx.measureText(value).width +
        18;

      ctx.fillStyle =
        active
          ? "#e8edf3"
          : "#0d131b";

      ctx.strokeStyle =
        active
          ? "#e8edf3"
          : "#2b3542";

      ctx.lineWidth = 1;

      ctx.beginPath();

      ctx.roundRect(
        x - width / 2,
        y - 13,
        width,
        26,
        13
      );

      ctx.fill();
      ctx.stroke();

      drawText(
        value,
        x,
        y,
        10,
        active
          ? "#080b10"
          : "#8994a4",
        "center",
        "600"
      );
    }


    function drawGlow(
      x,
      y,
      radius,
      color,
      alpha = 0.2
    ) {

      const gradient =
        ctx.createRadialGradient(
          x,
          y,
          0,
          x,
          y,
          radius
        );

      gradient.addColorStop(
        0,
        color.replace(
          "ALPHA",
          String(alpha)
        )
      );

      gradient.addColorStop(
        1,
        color.replace(
          "ALPHA",
          "0"
        )
      );

      ctx.fillStyle =
        gradient;

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
      );

      ctx.fill();
    }


    /* =========================================================
       DA — DIALECTICAL ALGORITHMIC
       ========================================================= */

    const dialectical = {

      name:
        "Dialectical–Algorithmic Cognition",

      kicker:
        "ORDERED CONTRADICTION-DRIVEN PROCESS",

      description:
        "State definition → thesis and antithesis → explicit contrast → contradiction → synthesis → rule → ordered algorithm → execution → feedback.",

      subject:
        "A machine",

      running:
        true,

      time:
        0,

      stage:
        0,

      stageDuration:
        2.8,

      stages: [

        [
          "STATE",
          "initial condition"
        ],

        [
          "THESIS",
          "affirm current relation"
        ],

        [
          "ANTITHESIS",
          "introduce opposing condition"
        ],

        [
          "CONTRAST",
          "compare formulations"
        ],

        [
          "CONTRADICTION",
          "locate incompatibility"
        ],

        [
          "SYNTHESIS",
          "resolve at higher level"
        ],

        [
          "RULE",
          "extract governing principle"
        ],

        [
          "ALGORITHM",
          "order the procedure"
        ],

        [
          "EXECUTE",
          "apply the procedure"
        ],

        [
          "FEEDBACK",
          "test and revise"
        ]

      ],


      algorithm: [

        "Define the current operating state",

        "Identify the conditions supporting it",

        "Run the established procedure",

        "Compare expected and observed output",

        "Detect the deviation",

        "Revise the procedure when conditions changed",

        "Execute the revised procedure",

        "Verify the new result"

      ],


      profiles: {

        machine: {

          axis:
            "stability ↔ adaptation",

          thesis:
            "The process is working because its procedure is stable.",

          antithesis:
            "The process may fail when operating conditions change.",

          synthesis:
            "A stable procedure remains valid only while its governing conditions hold.",

          rule:
            "Validate conditions before repeating a procedure."

        },

        university: {

          axis:
            "consistency ↔ adaptation",

          thesis:
            "Consistency of rules supports reliable operation.",

          antithesis:
            "Rigid consistency can obstruct changing educational needs.",

          synthesis:
            "Rules should remain stable structurally while procedures adapt to context.",

          rule:
            "Preserve the governing principle; adapt the procedure to the case."

        },

        ecosystem: {

          axis:
            "equilibrium ↔ transformation",

          thesis:
            "Existing relationships stabilize the system.",

          antithesis:
            "Environmental change can disrupt those relationships.",

          synthesis:
            "Equilibrium is maintained by mechanisms that can themselves change.",

          rule:
            "Track the relation, then update the mechanism when the relation changes."

        },

        friendship: {

          axis:
            "expectation ↔ circumstance",

          thesis:
            "Consistency of expectations makes interaction predictable.",

          antithesis:
            "Changing circumstances can invalidate old expectations.",

          synthesis:
            "A durable relationship preserves its core principle while revising outdated expectations.",

          rule:
            "Keep the relationship principle; update assumptions when circumstances change."

        },

        city: {

          axis:
            "structure ↔ demand",

          thesis:
            "Established infrastructure constrains and stabilizes activity.",

          antithesis:
            "Changing population and behavior can exceed those constraints.",

          synthesis:
            "Infrastructure remains useful only when its rules and capacities match current demand.",

          rule:
            "Compare the operating structure against changing demand before scaling it."

        },

        idea: {

          axis:
            "formulation ↔ counterexample",

          thesis:
            "The initial formulation captures a useful pattern.",

          antithesis:
            "A counterexample exposes limits in the formulation.",

          synthesis:
            "A stronger formulation preserves what survives the counterexample.",

          rule:
            "Refine the rule at the point where a counterexample defeats it."

        }

      },


      profile() {

        const lower =
          this.subject.toLowerCase();

        for (
          const key of Object.keys(this.profiles)
        ) {

          if (
            lower.includes(key)
          ) {

            return this.profiles[key];
          }
        }

        return this.profiles.idea;
      },


      reset() {

        this.time = 0;
        this.stage = 0;
      },


      nextStage() {

        this.stage =
          (
            this.stage + 1
          ) %
          this.stages.length;

        this.time = 0;
      },


      update(dt) {

        if (!this.running) {
          return;
        }

        this.time += dt;

        if (
          this.time >=
          this.stageDuration
        ) {

          this.time = 0;

          this.stage =
            (
              this.stage + 1
            ) %
            this.stages.length;
        }
      },


      draw() {

        clearScene();

        const cx =
          canvasWidth / 2;

        const cy =
          canvasHeight * 0.48;

        const profile =
          this.profile();

        const positions = [

          [
            cx,
            cy - 220
          ],

          [
            cx - 230,
            cy - 110
          ],

          [
            cx + 230,
            cy - 110
          ],

          [
            cx - 155,
            cy
          ],

          [
            cx + 155,
            cy
          ],

          [
            cx,
            cy + 90
          ],

          [
            cx,
            cy + 175
          ],

          [
            cx - 165,
            cy + 240
          ],

          [
            cx + 165,
            cy + 240
          ],

          [
            cx,
            cy + 315
          ]

        ];


        /*
         * Main ordered process.
         */

        for (
          let i = 0;
          i < positions.length - 1;
          i++
        ) {

          const a =
            positions[i];

          const b =
            positions[i + 1];

          drawArrow(
            a[0],
            a[1] + 31,
            b[0],
            b[1] - 31,
            "rgba(170,185,205,0.13)",
            1
          );
        }


        /*
         * Opposition branches.
         */

        drawArrow(
          positions[1][0] + 32,
          positions[1][1] + 15,
          positions[4][0] - 38,
          positions[4][1] - 15,
          "rgba(205,215,230,0.18)",
          1
        );

        drawArrow(
          positions[2][0] - 32,
          positions[2][1] + 15,
          positions[3][0] + 38,
          positions[3][1] - 15,
          "rgba(205,215,230,0.18)",
          1
        );


        /*
         * Nodes.
         */

        for (
          let i = 0;
          i < positions.length;
          i++
        ) {

          const x =
            positions[i][0];

          const y =
            positions[i][1];

          const distanceFromStage =
            Math.abs(
              i - this.stage
            );

          const activation =
            clamp(
              1 -
              distanceFromStage *
              0.25
            );

          const radius =
            i === 4 ||
            i === 5
              ? 42
              : 32;

          if (
            i === this.stage
          ) {

            drawGlow(
              x,
              y,
              radius * 2.4,
              "rgba(210,225,240,ALPHA)",
              0.13
            );
          }

          drawCircle(
            x,
            y,
            radius,
            `rgba(215,224,235,${0.025 + activation * 0.065})`,
            `rgba(215,224,235,${0.12 + activation * 0.56})`,
            i === this.stage
              ? 2
              : 1
          );

          drawText(
            this.stages[i][0],
            x,
            y,
            9,
            i === this.stage
              ? "#f4f6f9"
              : "#7f8a9a",
            "center",
            "700"
          );

          drawText(
            this.stages[i][1],
            x,
            y + radius + 12,
            7,
            i === this.stage
              ? "#929eae"
              : "#4e5968",
            "center",
            "400"
          );
        }


        /*
         * Central conceptual state.
         */

        const centerPulse =
          112 +
          Math.sin(
            this.time * 2
          ) *
          12;

        drawCircle(
          cx,
          cy,
          centerPulse,
          "rgba(220,230,240,0.012)",
          "rgba(200,215,230,0.07)",
          1
        );


        drawText(
          this.subject.toUpperCase(),
          cx,
          cy - 21,
          9,

            );

          ay +=
            randomBetween(
              -0.02,
              0.02
            );


          variant.vx +=
            ax *
            0.060;

          variant.vy +=
            ay *
            0.060;


          const speed =
            Math.hypot(
              variant.vx,
              variant.vy
            );

          const speedLimit =
            4 +
            variant.energy *
            1.8;

          if (
            speed >
            speedLimit
          ) {

            const scale =
              speedLimit /
              speed;

            variant.vx *=
              scale;

            variant.vy *=
              scale;
          }


          variant.vx *=
            0.973;

          variant.vy *=
            0.973;


          variant.x +=
            variant.vx;

          variant.y +=
            variant.vy;


          /*
           * Boundary reflection.
           */

          if (
            variant.x < 15
          ) {

            variant.x = 15;
            variant.vx =
              Math.abs(
                variant.vx
              ) *
              0.6;
          }

          if (
            variant.x >
            canvasWidth - 15
          ) {

            variant.x =
              canvasWidth - 15;

            variant.vx =
              -Math.abs(
                variant.vx
              ) *
              0.6;
          }

          if (
            variant.y < 15
          ) {

            variant.y = 15;

            variant.vy =
              Math.abs(
                variant.vy
              ) *
              0.6;
          }

          if (
            variant.y >
            canvasHeight - 15
          ) {

            variant.y =
              canvasHeight - 15;

            variant.vy =
              -Math.abs(
                variant.vy
              ) *
              0.6;
          }


          /*
           * Evaluate proximity to attractor.
           */

          const goalDistance =
            Math.hypot(
              variant.x - cx,
              variant.y - cy
            );

          variant.score =
            clamp(
              1 -
              goalDistance /
              480
            );


          /*
           * Trail.
           */

          variant.trail.push([
            variant.x,
            variant.y
          ]);

          if (
            variant.trail.length >
            22
          ) {

            variant.trail.shift();
          }


          /*
           * Successful variants generate
           * new alternatives.
           */

          if (
            variant.score >
              0.82 &&
            Math.random() <
              0.008 &&
            this.variants.length <
              90
          ) {

            this.spawnVariant(
              variant
            );
          }

        }


        /*
         * Prevent unbounded growth.
         */

        if (
          this.variants.length >
          90
        ) {

          this.variants.splice(
            0,
            10
          );
        }

      },


      draw() {

        clearScene();

        const cx =
          canvasWidth / 2;

        const cy =
          canvasHeight / 2;


        /*
         * Vortex field.
         */

        for (
          let i = 0;
          i < this.vortices.length;
          i++
        ) {

          const vortex =
            this.vortices[i];

          const x =
            cx +
            canvasWidth *
            vortex.offsetX;

          const y =
            cy +
            canvasHeight *
            vortex.offsetY;

          for (
            let ring = 0;
            ring < 3;
            ring++
          ) {

            const radius =
              vortex.radius *
              (
                0.35 +
                ring *
                0.20
              );

            ctx.beginPath();

            ctx.arc(
              x,
              y,
              radius,
              0,
              Math.PI * 2
            );

            ctx.strokeStyle =
              `rgba(130,155,185,${0.045 + ring * 0.018})`;

            ctx.lineWidth = 1;

            ctx.stroke();
          }
        }


        /*
         * Substrate.
         */

        for (
          const particle of
          this.substrate
        ) {

          drawCircle(
            particle.x,
            particle.y,
            1.2,
            "rgba(150,175,200,0.12)"
          );
        }


        /*
         * Emergent goal.
         */

        drawGlow(
          cx,
          cy,
          115,
          "rgba(210,225,240,ALPHA)",
          0.13
        );

        drawCircle(
          cx,
          cy,
          52,
          "rgba(220,230,240,0.035)",
          "rgba(190,205,220,0.65)",
          1
        );

        drawCircle(
          cx,
          cy,
          24 +
          Math.sin(
            this.time * 2
          ) *
          3,
          "rgba(225,235,245,0.035)",
          "rgba(225,235,245,0.34)",
          1
        );

        drawText(
          "EMERGENT GOAL",
          cx,
          cy,
          9,
          "#e7edf3",
          "center",
          "700"
        );


        /*
         * Variants and trails.
         */

        for (
          const variant of
          this.variants
        ) {

          if (
            variant.trail.length >
            1
          ) {

            ctx.beginPath();

            ctx.moveTo(
              variant.trail[0][0],
              variant.trail[0][1]
            );

            for (
              let i = 1;
              i <
              variant.trail.length;
              i++
            ) {

              ctx.lineTo(
                variant.trail[i][0],
                variant.trail[i][1]
              );
            }

            ctx.strokeStyle =
              `rgba(180,200,220,${0.025 + variant.score * 0.17})`;

            ctx.lineWidth = 1;

            ctx.stroke();
          }


          const radius =
            1.5 +
            variant.score *
            3;

          drawCircle(
            variant.x,
            variant.y,
            radius,
            `rgba(215,228,240,${0.22 + variant.score * 0.62})`
          );
        }


        /*
         * State label.
         */

        const stateLabels = [

          "FLUCTUATION / GENERATING ALTERNATIVES",

          "VORTICAL EXPLORATION",

          "SCREENING WEAK VARIANTS",

          "POSITIVE FEEDBACK",

          "CONCENTRATION → BURST → DISSIPATION"

        ];


        drawText(
          stateLabels[this.stage],
          cx,
          31,
          10,
          "#9aa7b8",
          "center",
          "700"
        );


        drawText(
          `${this.variants.length} variants  •  attractor active  •  circulation + fluctuation`,
          cx,
          canvasHeight - 28,
          9,
          "#5f6c7c",
          "center",
          "400"
        );

      }

    };


    /* =========================================================
       SIMULATION REGISTRY
       ========================================================= */

    const simulations = {

      da:
        dialectical,

      cd:
        causal,

      hp:
        panoramic,

      vs:
        vortical

    };


    /* =========================================================
       CONTROL HELPERS
       ========================================================= */

    function createButton(
      label,
      handler,
      icon = null
    ) {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "control-button rounded-lg px-3 py-2 text-xs flex items-center gap-2";

      if (icon) {

        const iconElement =
          document.createElement(
            "i"
          );

        iconElement.className =
          icon;

        button.appendChild(
          iconElement
        );
      }

      const textNode =
        document.createTextNode(
          label
        );

      button.appendChild(
        textNode
      );

      button.addEventListener(
        "click",
        handler
      );

      controlsElement.appendChild(
        button
      );

      return button;
    }


    function createSubjectInput(
      simulation
    ) {

      const input =
        document.createElement(
          "input"
        );

      input.type =
        "text";

      input.value =
        simulation.subject;

      input.className =
        "control-input rounded-lg px-3 py-2 text-xs w-44 sm:w-56";

      input.setAttribute(
        "aria-label",
        "Simulation subject"
      );

      input.addEventListener(
        "change",
        () => {

          simulation.subject =
            input.value.trim() ||
            simulation.subject;
        }
      );

      controlsElement.appendChild(
        input
      );
    }


    /* =========================================================
       UI
       ========================================================= */

    function updateTabs() {

      for (
        const tab of tabs
      ) {

        const active =
          tab.dataset.simulation ===
          activeSimulation;

        tab.classList.toggle(
          "active",
          active
        );

        tab.classList.toggle(
          "text-slate-400",
          !active
        );
      }
    }


    function updateHeader(
      simulation
    ) {

      kickerElement.textContent =
        simulation.kicker;

      titleElement.textContent =
        simulation.name;

      descriptionElement.textContent =
        simulation.description;
    }


    function updateControls(
      simulation
    ) {

      controlsElement.innerHTML =
        "";


      createButton(
        simulation.running
          ? "Pause"
          : "Resume",
        () => {

          simulation.running =
            !simulation.running;

          updateInterface();
        },
        simulation.running
          ? "fas fa-pause"
          : "fas fa-play"
      );


      createButton(
        "Reset",
        () => {

          simulation.reset();

          updateInterface();
        },
        "fas fa-redo-alt"
      );


      if (
        activeSimulation ===
        "da"
      ) {

        createButton(
          "Next Stage",
          () => {

            simulation.nextStage();

            updateInterface();
          },
          "fas fa-step-forward"
        );

        createSubjectInput(
          simulation
        );
      }


      if (
        activeSimulation ===
        "cd"
      ) {

        createSubjectInput(
          simulation
        );
      }


      if (
        activeSimulation ===
        "hp"
      ) {

        createSubjectInput(
          simulation
        );
      }


      if (
        activeSimulation ===
        "vs"
      ) {

        createButton(
          "Burst",
          () => {

            for (
              let i = 0;
              i < 8;
              i++
            ) {

              simulation.spawnVariant();
            }

            updateInterface();
          },
          "fas fa-bolt"
        );
      }

    }


    function metricCell(
      label,
      value
    ) {

      return `

        <div
          class="
            metric-cell
            p-3
            sm:p-4
            border-r
            border-slate-800
          "
        >

          <div
            class="
              mono
              text-[9px]
              tracking-[0.2em]
              uppercase
              text-slate-600
            "
          >
            ${label}
          </div>

          <div
            class="
              mt-1
              mono
              text-sm
              text-slate-300
            "
          >
            ${value}
          </div>

        </div>

      `;
    }


    function updateMetrics() {

      if (
        activeSimulation ===
        "da"
      ) {

        const simulation =
          dialectical;

        const progress =
          Math.round(
            (
              simulation.time /
              simulation.stageDuration
            ) *
            100
          );


        metricsElement.innerHTML =

          metricCell(
            "STAGE",
            simulation.stages[
              simulation.stage
            ][0]
          ) +

          metricCell(
            "PROGRESS",
            `${progress}%`
          ) +

          metricCell(
            "CONTRADICTION",
            simulation.stage >= 2 &&
            simulation.stage <= 4
              ? "HIGH"
              : "LOW"
          ) +

          metricCell(
            "MODE",
            "ITERATIVE"
          );

        return;
      }


      if (
        activeSimulation ===
        "cd"
      ) {

        const simulation =
          causal;

        metricsElement.innerHTML =

          metricCell(
            "STAGE",
            simulation.stages[
              simulation.stage
            ]
          ) +

          metricCell(
            "DETERMINISM",
            "94%"
          ) +

          metricCell(
            "CLARITY",
            "88%"
          ) +

          metricCell(
            "CERTAINTY",
            "84%"
          );

        return;
      }


      if (
        activeSimulation ===
        "hp"
      ) {

        const simulation =
          panoramic;

        metricsElement.innerHTML =

          metricCell(
            "PROJECTION",
            simulation.projections[
              simulation.stage
            ][0]
          ) +

          metricCell(
            "CRITERION",
            "ROTATING"
          ) +

          metricCell(
            "INVARIANTS",
            simulation.invariants.length
          ) +

          metricCell(
            "MODE",
            "PANORAMIC"
          );

        return;
      }


      if (
        activeSimulation ===
        "vs"
      ) {

        const simulation =
          vortical;

        const states = [

          "FLUCTUATION",

          "EXPLORATION",

          "SCREENING",

          "FEEDBACK",

          "DISSIPATION"

        ];


        metricsElement.innerHTML =

          metricCell(
            "STATE",
            states[
              simulation.stage
            ]
          ) +

          metricCell(
            "VARIANTS",
            simulation.variants.length
          ) +

          metricCell(
            "ATTRACTOR",
            "ACTIVE"
          ) +

          metricCell(
            "FEEDBACK",
            "POSITIVE"
          );
      }

    }


    function updateHint() {

      const hints = {

        da:
          "Dialectical–Algorithmic: the active stage moves through an ordered contradiction-driven cycle. Use Next Stage for manual progression.",

        cd:
          "Causal–Deterministic: explicit intermediate links are retained between premises, mechanisms, consequences and the singular result.",

        hp:
          "Holographical–Panoramic: the central object remains fixed while the criterion and projection rotate around it.",

        vs:
          "Vortical–Synergetic: variants circulate through a fluctuating field, are screened by proximity to the emergent goal and can generate new alternatives."

      };


      hintElement.textContent =
        hints[
          activeSimulation
        ];
    }


    function updateInterface() {

      const simulation =
        simulations[
          activeSimulation
        ];

      updateTabs();

      updateHeader(
        simulation
      );

      updateControls(
        simulation
      );

      updateMetrics();

      updateHint();
    }


    /* =========================================================
       TAB NAVIGATION
       ========================================================= */

    for (
      const tab of tabs
    ) {

      tab.addEventListener(
        "click",
        () => {

          activeSimulation =
            tab.dataset.simulation;

          simulations[
            activeSimulation
          ].reset();

          updateInterface();
        }
      );
    }


    /* =========================================================
       KEYBOARD CONTROLS
       ========================================================= */

    window.addEventListener(
      "keydown",
      event => {

        /*
         * Don't intercept keyboard input
         * while the subject field is focused.
         */

        const tag =
          document.activeElement
            ?.tagName
            ?.toLowerCase();

        if (
          tag === "input" ||
          tag === "textarea"
        ) {
          return;
        }


        const simulation =
          simulations[
            activeSimulation
          ];


        if (
          event.code ===
          "Space"
        ) {

          event.preventDefault();

          simulation.running =
            !simulation.running;

          updateInterface();
        }


        if (
          event.key.toLowerCase() ===
          "r"
        ) {

          simulation.reset();

          updateInterface();
        }


        if (
          activeSimulation ===
          "da" &&
          event.key === "ArrowRight"
        ) {

          dialectical.nextStage();

          updateInterface();
        }


        if (
          activeSimulation ===
          "vs" &&
          event.key.toLowerCase() ===
          "b"
        ) {

          for (
            let i = 0;
            i < 8;
            i++
          ) {

            vortical.spawnVariant();
          }

          updateInterface();
        }

      }
    );


    /* =========================================================
       ANIMATION LOOP
       ========================================================= */

    function animationLoop(
      timestamp
    ) {

      const delta =
        Math.min(
          0.05,
          (
            timestamp -
            previousTime
          ) /
          1000
        );

      previousTime =
        timestamp;


      const simulation =
        simulations[
          activeSimulation
        ];


      simulation.update(
        delta
      );

      simulation.draw();


      uiRefreshClock +=
        delta;


      /*
       * Don't rebuild DOM controls
       * every animation frame.
       */

      if (
        uiRefreshClock >
        0.35
      ) {

        uiRefreshClock = 0;

        updateMetrics();
      }


      requestAnimationFrame(
        animationLoop
      );
    }


    /* =========================================================
       INITIALIZATION
       ========================================================= */

    dialectical.reset();
    causal.reset();
    panoramic.reset();
    vortical.reset();

    updateInterface();

    requestAnimationFrame(
      animationLoop
    );

  </script>

</body>
</html>
